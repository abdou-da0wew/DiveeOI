[package]
name = "coenx-video-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cairo-rs = { version = "0.21.5", default-features = false, features = ["png"] }
glib = "0.21.5"
pango = "0.21.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
