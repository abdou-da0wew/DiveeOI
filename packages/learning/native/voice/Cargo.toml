[package]
name = "divee-voice"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
# ONNX Runtime loaded dynamically (same pattern as divee-retrieval: ORT_DYLIB_PATH
# or a pip/system onnxruntime provides the dylib; CUDA EP registered when present).
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "cuda"] }
# Local STT (vosk) — links vendored libvosk.so from lib/ (see build.rs).
vosk = "0.3.1"
# Cloud STT (OpenAI-compatible /audio/transcriptions) — sync client, no async runtime.
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
base64 = "0.22"

# vendored supertonic-3 inference (upstream supertone-inc/supertonic rust/ binding, Apache-2.0)
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
hound = "3.5"
rustfft = "6.2"
unicode-normalization = "0.1"
regex = "1.10"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
