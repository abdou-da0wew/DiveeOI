[package]
name = "divee-retrieval"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Native student-encoder inference (no Python at query time): ONNX Runtime loaded
# dynamically (pip/system install provides the dylib; ORT_DYLIB_PATH overrides),
# CUDA execution provider registered when the runtime ships it, CPU otherwise.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "cuda", "api-20"] }
# HF tokenizers (pure Rust) loads the tokenizer.json exported next to the student graph.
tokenizers = { version = "0.23", default-features = false, features = ["onig", "esaxx_fast"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
